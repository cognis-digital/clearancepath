apiVersion: apps/v1
kind: Deployment
metadata: { name: clearancepath, labels: { app: clearancepath } }
spec:
  replicas: 1
  selector: { matchLabels: { app: clearancepath } }
  template:
    metadata: { labels: { app: clearancepath } }
    spec:
      containers:
        - name: clearancepath
          image: ghcr.io/cognis-digital/clearancepath:latest
          ports: [{ containerPort: 8000 }]
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata: { name: clearancepath }
spec:
  selector: { app: clearancepath }
  ports: [{ port: 80, targetPort: 8000 }]
